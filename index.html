    /* System font stacks — Devanagari support built into Android/iOS/Windows/Mac */
    :root {
      --font-devanagari: 'Noto Serif Devanagari', 'Shobhika', 'Mangal',

      width: 100%;
      max-width: 600px;
      padding: 1rem 1rem 2rem;
      flex: 1;

      background: var(--warm-white);

      display: block;

      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.45rem;

      font-family: var(--font-mono);

  '', 'एक', 'दोन', 'तीन', 'चार', 'पाच', 'सहा', 'सात', 'आठ', 'नऊ',

  'सत्तर', 'एकाहत्तर', 'बाहत्तर', 'त्र्याहत्तर', 'चौऱ्याहत्तर', 'पंच्याहत्तर', 'शहात्तर', 'सत्त्याहत्तर', 'अठ्ठ्याहत्तर', 'एकोणऐंशी',
  'ऐंशी', 'एक्याऐंशी', 'ब्याऐंशी', 'त्र्याऐंशी', 'चौऱ्याऐंशी', 'पंच्याऐंशी', 'शहाऐंशी', 'सत्त्याऐंशी', 'अठ्ठ्याऐंशी', 'एकोणनव्वद',
  'नव्वद', 'एक्याण्णव', 'ब्याण्णव', 'त्र्याण्णव', 'चौऱ्याण्णव', 'पंच्याण्णव', 'शहाण्णव', 'सत्त्याण्णव', 'अठ्ठ्याण्णव', 'नव्याण्णव'
];

const ones_en = [
  '', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
  'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen',

];

// ── CONVERTERS ────────────────────────────────────────────
function numToWordsMr(n) {
  if (n === 0) return 'शून्य';
  if (n < 0)   return 'ऋण ' + numToWordsMr(-n);
  let p = [], r = n;
  const crore = Math.floor(r / 10000000); r %= 10000000;
  const lakh  = Math.floor(r / 100000);   r %= 100000;
  const hajar = Math.floor(r / 1000);     r %= 1000;
  const shat  = Math.floor(r / 100);      r %= 100;
  if (crore) p.push(numToWordsMr(crore) + ' कोटी');
  if (lakh)  p.push(ones_mr[lakh]  + ' लाख');
  if (hajar) p.push(ones_mr[hajar] + ' हजार');
  if (shat)  p.push(ones_mr[shat]  + 'शे');
  if (r)     p.push(ones_mr[r]);
  return p.join(' ');
}

function numToWordsEn(n) {
  if (n === 0) return 'Zero';
  if (n < 0)   return 'Minus ' + numToWordsEn(-n);
  let p = [], r = n;
  const crore = Math.floor(r / 10000000); r %= 10000000;
  const lakh  = Math.floor(r / 100000);   r %= 100000;
  const hajar = Math.floor(r / 1000);     r %= 1000;
  const shat  = Math.floor(r / 100);      r %= 100;
  if (crore) p.push(numToWordsEn(crore) + ' Crore');
  if (lakh)  p.push(ones_en[lakh]  + ' Lakh');
  if (hajar) p.push(ones_en[hajar] + ' Thousand');
  if (shat)  p.push(ones_en[shat]  + ' Hundred');
  if (r)     p.push(ones_en[r]);
  return p.join(' ');
}

// ── STATE ─────────────────────────────────────────────────
let mode = 'rupee';

function setMode(m) {
  mode = m;
  document.getElementById('modeRupee').classList.toggle('active', m === 'rupee');
  document.getElementById('modeOnly').classList.toggle('active',  m === 'only');
  convert();
}

// ── CLEAR ─────────────────────────────────────────────────
function clearAll() {
  document.getElementById('numInput').value = '';
  document.getElementById('resultCard').innerHTML = '<div class="placeholder">🔢</div>';
  document.getElementById('numInput').focus();
}

// ── CONVERT ───────────────────────────────────────────────
function convert() {
  const raw  = document.getElementById('numInput').value.trim();
  const card = document.getElementById('resultCard');

  if (raw === '') {
    card.innerHTML = '<div class="placeholder">🔢</div>';
    return;
  }

  const num = parseFloat(raw);
  if (isNaN(num) || num < 0) {
    card.innerHTML = '<div class="error-msg">कृपया योग्य अंक टाका (0 किंवा त्यापेक्षा जास्त)</div>';
    return;
  }

  const intPart   = Math.floor(num);
  const decStr    = raw.includes('.') ? raw.split('.')[1] : '';
  const paisePart = decStr ? parseInt(decStr.substring(0, 2).padEnd(2, '0')) : 0;

  let mr = numToWordsMr(intPart);
  let en = numToWordsEn(intPart);

  if (mode === 'rupee') {
    mr += ' रुपये';
    en += ' Rupees';
    if (paisePart) {
      mr += ' आणि ' + numToWordsMr(paisePart) + ' पैसे';
      en += ' and '  + numToWordsEn(paisePart) + ' Paise';
    }
    mr += ' फक्त';
    en += ' Only';
  }

  const formatted = intPart.toLocaleString('en-IN') + (decStr ? '.' + decStr : '');

  card.innerHTML =
    row('अंक',    formatted, 'number-text') +
    row('मराठी',  mr,        'marathi-text') +
    row('English', en,       'english-text');
}

function row(label, value, cls) {
  const id = 'v_' + label.replace(/\s/g, '_');
  return `
    <div class="result-row">
      <div class="row-label">${label}</div>
      <div class="row-value ${cls}" id="${id}">${value}</div>
      <button class="copy-btn" onclick="doCopy('${id}',this)" title="Copy">
        📋<span class="clbl">Copy</span>
      </button>
    </div>`;
}

function doCopy(id, btn) {
  const text = document.getElementById(id).textContent;
  const done = () => {
    btn.classList.add('copied');
    btn.innerHTML = '✅<span class="clbl">Done</span>';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋<span class="clbl">Copy</span>';
    }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  cb();
}

// Enter key support
document.getElementById('numInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') convert();
});
</script>
